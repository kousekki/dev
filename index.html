<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゴールドコイン ストップウォッチ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at center, #fff9d6 0%, #ffe98a 35%, #f4c83d 100%);
            font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            overflow: hidden;
        }

        .game {
            width: 90%;
            max-width: 650px;
            padding: 40px 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            border: 5px solid #e0ad19;
            border-radius: 30px;
            box-shadow:
                0 15px 40px rgba(135, 91, 0, 0.3),
                inset 0 0 20px rgba(255, 220, 80, 0.4);
        }

        h1 {
            margin: 0 0 25px;
            color: #9b6900;
            font-size: clamp(26px, 6vw, 42px);
            text-shadow: 2px 2px 0 #ffe47a;
        }

        /* ストップウォッチ */
        .timer {
            font-size: clamp(55px, 13vw, 100px);
            font-weight: bold;
            color: #3d2b00;
            letter-spacing: 4px;
            margin-bottom: 25px;
            font-variant-numeric: tabular-nums;
        }

        /* コイン表示 */
        .coin-area {
            position: relative;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        .coin {
            width: 150px;
            height: 150px;
            position: relative;
            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 28%,
                    #fff8a8 0%,
                    #fff06a 15%,
                    #ffd936 38%,
                    #f2bd17 70%,
                    #c98d00 100%
                );

            border: 10px solid #d69d08;

            box-shadow:
                0 0 0 5px #ffe56a,
                0 8px 0 #b77d00,
                0 12px 20px rgba(100, 65, 0, 0.3);

            image-rendering: pixelated;
        }

        /* コイン中央の模様 */
        .coin::before {
            content: "★";
            position: absolute;
            inset: 15px;
            display: flex;
            justify-content: center;
            align-items: center;

            color: #f8c927;
            font-size: 70px;

            text-shadow:
                2px 2px 0 #fff17b,
                -2px -2px 0 #d89d00,
                3px 3px 0 #c28a00;
        }

        /* コインの光 */
        .coin::after {
            content: "";
            position: absolute;
            width: 35px;
            height: 18px;
            top: 20px;
            left: 28px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 50%;
            transform: rotate(-25deg);
        }

        /* コインが増えたときのアニメーション */
        .coin.coin-get {
            animation: coinGet 0.65s ease-out;
        }

        @keyframes coinGet {
            0% {
                transform: scale(0.7) rotate(-15deg);
                filter: brightness(1);
            }

            35% {
                transform: scale(1.25) rotate(10deg);
                filter: brightness(1.5);
            }

            65% {
                transform: scale(1.08) rotate(-5deg);
                filter: brightness(1.25);
            }

            100% {
                transform: scale(1) rotate(0deg);
                filter: brightness(1);
            }
        }

        /* +1 COIN 演出 */
        .plus-one {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);

            font-size: 40px;
            font-weight: bold;
            color: #ffb800;

            text-shadow:
                2px 2px 0 white,
                4px 4px 0 #c88800;

            opacity: 0;
            pointer-events: none;
        }

        .plus-one.show {
            animation: plusOne 0.8s ease-out;
        }

        @keyframes plusOne {
            0% {
                opacity: 0;
                transform: translate(-50%, 30px) scale(0.5);
            }

            25% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1.2);
            }

            70% {
                opacity: 1;
                transform: translate(-50%, -25px) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -60px) scale(0.8);
            }
        }

        /* コイン総数 */
        .total-box {
            margin: 10px auto 25px;
            padding: 15px 20px;
            width: min(90%, 420px);

            background: linear-gradient(
                180deg,
                #fff8c7,
                #ffe477
            );

            border: 3px solid #dca600;
            border-radius: 18px;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.8);
        }

        .total-label {
            font-size: 17px;
            color: #775100;
            font-weight: bold;
        }

        .total {
            margin-top: 3px;
            font-size: 45px;
            font-weight: bold;
            color: #9a6900;
            text-shadow: 2px 2px 0 #fff0a0;
            font-variant-numeric: tabular-nums;
        }

        .unit {
            font-size: 22px;
            margin-left: 5px;
        }

        /* ボタン */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 15px 28px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }

        #startBtn {
            color: white;
            background: linear-gradient(#48d66b, #20a943);
        }

        #pauseBtn {
            color: white;
            background: linear-gradient(#ffbf3d, #e58a00);
        }

        #resetBtn {
            color: white;
            background: linear-gradient(#ff6565, #d93636);
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        /* 下に浮かぶ小さなコイン */
        .particle {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;

            background: #ffd52f;
            border: 3px solid #d59d00;

            pointer-events: none;
            animation: particle 0.8s ease-out forwards;
        }

        @keyframes particle {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }

            100% {
                opacity: 0;
                transform:
                    translate(
                        calc((var(--random-x) - 50) * 2px),
                        -120px
                    )
                    rotate(180deg)
                    scale(0.3);
            }
        }

        @media (max-width: 500px) {
            .game {
                padding: 25px 15px;
            }

            .coin-area {
                height: 210px;
            }

            .coin {
                width: 125px;
                height: 125px;
            }

            .coin::before {
                font-size: 55px;
            }

            .plus-one {
                font-size: 32px;
            }

            button {
                padding: 13px 20px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="game">

        <h1>🪙 GOLD STOPWATCH</h1>

        <!-- ストップウォッチ -->
        <div class="timer" id="timer">00:00:00</div>

        <!-- コイン -->
        <div class="coin-area" id="coinArea">

            <div class="plus-one" id="plusOne">+1 COIN!</div>

            <div class="coin" id="coin"></div>

        </div>

        <!-- コイン総数 -->
        <div class="total-box">

            <div class="total-label">
                🪙 コイン総数
            </div>

            <div class="total">
                <span id="totalCoins">0</span>
                <span class="unit">COINS</span>
            </div>

        </div>

        <!-- ボタン -->
        <div class="buttons">

            <button id="startBtn">
                ▶ スタート
            </button>

            <button id="pauseBtn" disabled>
                ⏸ 一時停止
            </button>

            <button id="resetBtn">
                ↻ リセット
            </button>

        </div>

    </main>


    <script>
        // ==========================
        // ストップウォッチ
        // ==========================

        let seconds = 0;
        let timerInterval = null;
        let isRunning = false;

        // HTML要素を取得
        const timer = document.getElementById("timer");
        const totalCoins = document.getElementById("totalCoins");

        const coin = document.getElementById("coin");
        const coinArea = document.getElementById("coinArea");
        const plusOne = document.getElementById("plusOne");

        const startBtn = document.getElementById("startBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const resetBtn = document.getElementById("resetBtn");


        // ==========================
        // 時間表示
        // ==========================

        function updateDisplay() {

            const hours = Math.floor(seconds / 3600);

            const minutes = Math.floor((seconds % 3600) / 60);

            const secs = seconds % 60;

            const hh = String(hours).padStart(2, "0");
            const mm = String(minutes).padStart(2, "0");
            const ss = String(secs).padStart(2, "0");

            timer.textContent = `${hh}:${mm}:${ss}`;

            // コイン総数 = 経過秒数
            totalCoins.textContent = seconds;
        }


        // ==========================
        // コイン獲得演出
        // ==========================

        function getCoin() {

            // コインを一度リセットしてアニメーションを再実行
            coin.classList.remove("coin-get");

            // ブラウザに再描画させる
            void coin.offsetWidth;

            coin.classList.add("coin-get");


            // +1 COIN! を表示
            plusOne.classList.remove("show");

            void plusOne.offsetWidth;

            plusOne.classList.add("show");


            // 小さなコインを飛ばす
            createParticles();
        }


        // ==========================
        // 小さなコインを作る
        // ==========================

        function createParticles() {

            for (let i = 0; i < 5; i++) {

                const particle = document.createElement("div");

                particle.classList.add("particle");

                particle.style.setProperty(
                    "--random-x",
                    Math.random() * 100
                );

                particle.style.left =
                    `${40 + Math.random() * 20}%`;

                particle.style.top =
                    `${45 + Math.random() * 20}%`;

                coinArea.appendChild(particle);


                // アニメーション終了後に削除
                setTimeout(() => {
                    particle.remove();
                }, 800);
            }
        }


        // ==========================
        // 1秒進める
        // ==========================

        function tick() {

            seconds++;

            updateDisplay();

            // 1秒ごとにコイン +1
            getCoin();
        }


        // ==========================
        // スタート
        // ==========================

        function start() {

            if (isRunning) {
                return;
            }

            isRunning = true;

            startBtn.disabled = true;
            pauseBtn.disabled = false;

            timerInterval = setInterval(tick, 1000);
        }


        // ==========================
        // 一時停止
        // ==========================

        function pause() {

            if (!isRunning) {
                return;
            }

            isRunning = false;

            clearInterval(timerInterval);
            timerInterval = null;

            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }


        // ==========================
        // リセット
        // ==========================

        function reset() {

            clearInterval(timerInterval);

            timerInterval = null;
            isRunning = false;

            seconds = 0;

            updateDisplay();

            startBtn.disabled = false;
            pauseBtn.disabled = true;

            coin.classList.remove("coin-get");
            plusOne.classList.remove("show");
        }


        // ==========================
        // ボタンイベント
        // ==========================

        startBtn.addEventListener("click", start);

        pauseBtn.addEventListener("click", pause);

        resetBtn.addEventListener("click", reset);


        // ==========================
        // 最初の表示
        // ==========================

        updateDisplay();

    </script>

</body>
</html>
